<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Đăng nhập Smember CellphoneS - bản mẫu để test luồng đăng nhập">
    <title>Đăng nhập | CellphoneS</title>
    <link rel="stylesheet" href="smember-login.css">
  </head>
  <body class="login-page">
    <header class="login-header">
      <a class="login-header__logo" href="index.html" aria-label="Về trang chủ CellphoneS">
        <img src="assets/user-info/Logo_CPS.webp" alt="CellphoneS">
      </a>
      <a class="login-header__home" href="index.html">Trang chủ</a>
    </header>

    <main class="login-main">
      <section class="login-card" aria-label="Đăng nhập">
        <h1 class="login-card__title">Đăng nhập Smember</h1>
        <p class="login-card__subtitle">Đăng nhập để xem thông tin tài khoản thành viên</p>

        <form class="login-form" data-login-form novalidate>
          <div class="login-form__field">
            <label class="login-form__label" for="login-phone">Số điện thoại</label>
            <input
              class="login-form__input"
              id="login-phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              maxlength="10"
              placeholder="Nhập số điện thoại 10 số"
              data-login-field="phone"
              autocomplete="username"
              aria-describedby="login-phone-error"
              required
            >
            <p
              class="login-form__field-error"
              id="login-phone-error"
              data-login-field-error="phone"
              aria-live="polite"
            ></p>
          </div>

          <div class="login-form__field">
            <label class="login-form__label" for="login-password">Mật khẩu</label>
            <div class="login-form__password-control">
              <input
                class="login-form__input"
                id="login-password"
                name="password"
                type="password"
                placeholder="Nhập mật khẩu"
                data-login-field="password"
                autocomplete="current-password"
                aria-describedby="login-password-caps login-password-error"
                required
              >
              <button
                class="login-form__password-toggle"
                type="button"
                data-password-toggle
                aria-label="Hiện mật khẩu"
                aria-pressed="false"
              >
                <svg class="login-form__password-icon login-form__password-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                <svg class="login-form__password-icon login-form__password-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3"/><path d="M6.2 6.2A16.4 16.4 0 0 0 2.5 12s3.5 6 9.5 6c1 0 1.9-.2 2.7-.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="login-form__caps-warning" id="login-password-caps" data-password-caps aria-live="polite"></p>
            <p
              class="login-form__field-error"
              id="login-password-error"
              data-login-field-error="password"
              aria-live="polite"
            ></p>
          </div>

          <p class="login-form__error" data-login-error role="alert" aria-live="polite"></p>

          <button class="login-form__submit" type="submit">Đăng nhập</button>
        </form>

        <div class="login-card__note">
          <p class="login-card__note-title">Tài khoản demo để test:</p>
          <ul class="login-card__note-list">
            <li><span>0901234567</span> / <span>User@123</span></li>
            <li><span>0387654321</span> / <span>Demo@456</span></li>
            <li><span>0791122334</span> / <span>Test@789</span></li>
          </ul>
          <p class="login-card__note-desc">
            Đây là bản mẫu tạm thời để test luồng đăng nhập và sẽ được thay thế bằng trang thiết kế chính thức.
          </p>
        </div>
      </section>
    </main>

    <script defer src="src/script/model/AAccount.js"></script>
    <script defer src="src/script/model/Account.js"></script>
    <script defer src="src/script/model/AUser.js"></script>
    <script defer src="src/script/model/User.js"></script>
    <script defer src="src/script/data/demo-data.js"></script>
    <script defer src="src/script/auth/AuthService.js"></script>
    <script defer src="src/script/auth/LoginController.js"></script>
    <script defer src="src/script/page/smember-login.js"></script>
  </body>
</html>
